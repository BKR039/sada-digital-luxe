name: SADA OS — Scheduled Reminders & Push Dispatcher

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual_verification'

jobs:
  run-scheduler:
    name: Execute SADA OS Reminder Scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SADA OS Scheduler Endpoint
        env:
          TARGET_URL: ${{ secrets.SADA_BASE_URL || 'https://boubakarhamedsghaier.com' }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          echo "Dispatching scheduled reminder check to $TARGET_URL..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL/api/notifications/scheduler" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SCHEDULER_SECRET" \
            -H "x-scheduler-secret: $SCHEDULER_SECRET" \
            -d '{"triggeredBy": "github_actions_cron"}')
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Scheduler execution returned HTTP $STATUS"
            exit 1
          fi
          echo "Scheduler executed successfully."
