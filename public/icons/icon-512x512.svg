<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sadaBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="60%" stop-color="#07090E" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    <linearGradient id="sadaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#sadaBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Subtle ambient ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#sadaAccent)" stroke-width="3" opacity="0.25" filter="url(#glow)" />

  <!-- SADA Primary Emblem / Letterform -->
  <g transform="translate(106, 120)">
    <!-- Top rounded brand bar -->
    <path d="M 0 40 C 0 18 18 0 40 0 L 260 0 C 282 0 300 18 300 40 L 300 48 L 0 48 Z" fill="#FFFFFF" />
    
    <!-- Dynamic horizontal identity ribs -->
    <rect x="0" y="64" width="300" height="12" rx="6" fill="#FFFFFF" opacity="0.95" />
    <rect x="0" y="88" width="300" height="10" rx="5" fill="#FFFFFF" opacity="0.85" />
    <rect x="0" y="110" width="300" height="8" rx="4" fill="url(#sadaAccent)" />
    <rect x="0" y="130" width="300" height="10" rx="5" fill="#FFFFFF" opacity="0.85" />
    <rect x="0" y="152" width="300" height="12" rx="6" fill="#FFFFFF" opacity="0.95" />

    <!-- Bottom brand bar -->
    <path d="M 0 176 L 300 176 L 300 184 C 300 206 282 224 260 224 L 40 224 C 18 224 0 206 0 184 Z" fill="#FFFFFF" />
  </g>

  <!-- Wordmark badge: SADA OS -->
  <g transform="translate(256, 420)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="6" fill="#FFFFFF">SADA OS</text>
  </g>
</svg>
