<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <title>SADA OS — You're Offline</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/pwa-icon-180x180.png" />
  <style>
    /* ============================================================
       SADA CANONICAL ARABIC TYPOGRAPHY: THMANYAH SERIF TEXT
       Local offline font loading with graceful system fallbacks
       ============================================================ */
    @font-face {
      font-family: 'Thmanyah Serif Text';
      src: url('/fonts/thmanyahseriftext-Regular.otf') format('opentype'),
           url('/fonts/thmanyah-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Serif Text';
      src: url('/fonts/thmanyahseriftext-Bold.otf') format('opentype'),
           url('/fonts/thmanyah-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ============================================================
       DESIGN SYSTEM TOKENS: LIGHT (CANONICAL DEFAULT) & DARK
       ============================================================ */
    :root {
      --sada-blue: #0167EA;
      --sada-cyan: #5CE1E6;
      --sada-cyan-rgb: 92, 225, 230;
      --sada-blue-rgb: 1, 103, 234;

      /* Clean white / subtle off-white background canvas */
      --bg-canvas: #F8FAFC;
      --bg-card: #FFFFFF;
      --border-card: #E2E8F0;
      --border-subtle: #F1F5F9;
      
      /* Dark navy / charcoal typography */
      --text-heading: #0F172A;
      --text-body: #334155;
      --text-muted: #64748B;
      
      --status-bg: #F8FAFC;
      --status-border: #E2E8F0;
      --status-text: #475569;
      --status-dot: #94A3B8;

      --icon-badge-bg: rgba(92, 225, 230, 0.14);
      --icon-badge-border: rgba(92, 225, 230, 0.45);
      --icon-badge-color: #0284C7;

      --btn-bg: linear-gradient(135deg, #0167EA 0%, #0284C7 100%);
      --btn-text: #FFFFFF;
      --btn-shadow: 0 4px 14px rgba(1, 103, 234, 0.28);
      --btn-shadow-hover: 0 8px 24px rgba(1, 103, 234, 0.38);

      --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.03), 0 20px 40px -15px rgba(15, 23, 42, 0.06);

      --font-latin: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Manrope", sans-serif;
      --font-arabic: 'Thmanyah Serif Text', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html.dark {
      --bg-canvas: #090D15;
      --bg-card: #111827;
      --border-card: rgba(255, 255, 255, 0.09);
      --border-subtle: rgba(255, 255, 255, 0.05);

      --text-heading: #F8FAFC;
      --text-body: #CBD5E1;
      --text-muted: #94A3B8;

      --status-bg: rgba(255, 255, 255, 0.05);
      --status-border: rgba(255, 255, 255, 0.08);
      --status-text: #94A3B8;
      --status-dot: #64748B;

      --icon-badge-bg: rgba(92, 225, 230, 0.10);
      --icon-badge-border: rgba(92, 225, 230, 0.28);
      --icon-badge-color: #38BDF8;

      --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    /* ============================================================
       BASE & RESET
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(ellipse 600px 320px at 50% 0%, rgba(var(--sada-cyan-rgb), 0.08), transparent 70%),
        radial-gradient(ellipse 500px 300px at 50% 100%, rgba(var(--sada-blue-rgb), 0.04), transparent 70%);
      color: var(--text-body);
      font-family: var(--font-latin);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    html[dir="rtl"] body {
      font-family: var(--font-arabic);
      direction: rtl;
    }

    /* ============================================================
       CARD CONTAINER
       ============================================================ */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 36px 28px 32px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @media (min-width: 640px) {
      .card {
        padding: 44px 36px 36px 36px;
      }
    }

    /* Header row: perfectly centered logo + corner language switcher */
    .header-row {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .lang-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 1px solid var(--status-border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-radius: 9999px;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.15s ease;
    }

    html[dir="rtl"] .lang-toggle {
      right: auto;
      left: 0;
      font-family: var(--font-arabic);
    }

    .lang-toggle:hover {
      color: var(--text-heading);
      border-color: var(--text-muted);
      background: var(--status-bg);
    }

    /* SADA Brand Logo */
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sada-logo-svg {
      height: 28px;
      width: auto;
      max-width: 135px;
      display: block;
    }

    /* Offline Visual Badge */
    .icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--icon-badge-bg);
      border: 1px solid var(--icon-badge-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      color: var(--icon-badge-color);
      transition: transform 0.3s ease;
    }

    .icon-badge svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Status Indicator */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--status-bg);
      border: 1px solid var(--status-border);
      border-radius: 9999px;
      padding: 5px 13px;
      font-size: 12px;
      font-weight: 500;
      color: var(--status-text);
      margin-bottom: 18px;
      transition: all 0.25s ease;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-dot);
      transition: background-color 0.25s ease;
      flex-shrink: 0;
    }

    /* Status variations */
    .status-pill.is-offline .status-dot {
      background: #F43F5E;
    }

    .status-pill.is-checking {
      color: #0284C7;
      border-color: rgba(var(--sada-cyan-rgb), 0.4);
    }
    .status-pill.is-checking .status-dot {
      background: #0284C7;
      animation: pulse 1s infinite alternate;
    }

    .status-pill.is-restored {
      background: #ECFDF5;
      border-color: #A7F3D0;
      color: #047857;
    }
    html.dark .status-pill.is-restored {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34D399;
    }
    .status-pill.is-restored .status-dot {
      background: #10B981;
    }

    @keyframes pulse {
      from { opacity: 0.4; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1.15); }
    }

    /* Copy Typography */
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    html[dir="rtl"] h1 {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: normal;
      font-family: var(--font-arabic);
    }

    .desc {
      font-size: 14.5px;
      color: var(--text-body);
      line-height: 1.6;
      max-width: 360px;
    }

    .sub-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 6px;
      margin-bottom: 24px;
      line-height: 1.55;
    }

    html[dir="rtl"] .desc,
    html[dir="rtl"] .sub-desc {
      font-family: var(--font-arabic);
      line-height: 1.7;
    }

    /* Retry Action Button */
    .btn-retry {
      width: 100%;
      min-height: 48px;
      padding: 13px 20px;
      border-radius: 14px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      user-select: none;
    }

    html[dir="rtl"] .btn-retry {
      font-family: var(--font-arabic);
      font-size: 15px;
      letter-spacing: normal;
    }

    .btn-retry:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: var(--btn-shadow-hover);
      filter: brightness(1.03);
    }

    .btn-retry:active:not(:disabled) {
      transform: translateY(0);
      filter: brightness(0.97);
    }

    .btn-retry:focus-visible {
      outline: 2px solid var(--sada-cyan);
      outline-offset: 3px;
    }

    .btn-retry:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Inline Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Feedback Banner */
    .feedback-banner {
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-body);
      background: var(--status-bg);
      border: 1px solid var(--status-border);
      border-radius: 12px;
      padding: 10px 14px;
      width: 100%;
      text-align: center;
      display: none;
      line-height: 1.45;
      animation: fadeIn 0.2s ease forwards;
    }

    html.dark .feedback-banner {
      color: var(--text-body);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.09);
    }

    html[dir="rtl"] .feedback-banner {
      font-family: var(--font-arabic);
      font-size: 13px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Standalone PWA Bottom Notch Clearance */
    .bottom-hint {
      margin-top: 18px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      opacity: 0.8;
    }

    html[dir="rtl"] .bottom-hint {
      font-family: var(--font-arabic);
    }
  </style>
</head>

      <button id="lang-btn" class="lang-toggle" onclick="toggleLanguage()" aria-label="Toggle language">
        العربية
      </button>

    <!-- Minimal Offline Visual: Circular Badge with Lucide WifiOff Icon -->
    <div class="icon-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"></path>

    <!-- Accurate Connection Status Indicator -->
    <div id="status-pill" class="status-pill is-offline">
      <span class="status-dot"></span>
      <span id="status-text">No Internet Connection</span>
    </div>

    <!-- Main Message Copy -->
    <h1 id="heading">You're Offline</h1>
    <p id="desc-line1" class="desc">SADA is temporarily unable to connect to the internet.</p>
    <p id="desc-line2" class="desc sub-desc">Check your connection and try again. Your workspace will be available once you're back online.</p>

    <!-- Primary Retry Action -->
    <button id="retry-btn" class="btn-retry" onclick="attemptReconnection()">
      <span id="retry-spinner" class="spinner" style="display: none;" aria-hidden="true"></span>
      <span id="retry-text">Retry Connection</span>
    </button>

    <!-- Subtle Feedback Notice for Failed Verification -->
    <div id="feedback-banner" class="feedback-banner" role="alert"></div>

    <!-- Discreet Standalone Indicator -->
    <div class="bottom-hint" id="pwa-hint">SADA OS • Workspace Engine</div>
  </main>

  <script>
    // ============================================================
    // SADA OFFLINE ENGINE: i18n, Theme, Verification & Navigation
    // ============================================================

    const I18N = {
      en: {
        title: "SADA OS — You're Offline",
        heading: "You're Offline",
        descLine1: "SADA is temporarily unable to connect to the internet.",
        descLine2: "Check your connection and try again. Your workspace will be available once you're back online.",
        btnRetry: "Retry Connection",
        btnConnecting: "Checking Connection...",
        statusOffline: "No Internet Connection",
        statusChecking: "Checking Connection...",
        statusRestored: "Connection Restored",
        feedbackOffline: "Still unable to connect. Please check your network and try again.",
        langToggle: "العربية",
        pwaHint: "SADA OS • Workspace Engine"
      },
      ar: {
        title: "نظام صدى — أنت غير متصل بالإنترنت",
        heading: "أنت غير متصل بالإنترنت",
        descLine1: "يتعذّر على SADA الاتصال بالإنترنت حاليًا.",
        descLine2: "تحقّق من اتصالك بالإنترنت وحاول مرة أخرى. ستتمكن من العودة إلى مساحة عملك عند استعادة الاتصال.",
        btnRetry: "إعادة المحاولة",
        btnConnecting: "جارٍ التحقق من الاتصال...",
        statusOffline: "لا يوجد اتصال بالإنترنت",
        statusChecking: "جارٍ التحقق من الاتصال...",
        statusRestored: "تم استعادة الاتصال",
        feedbackOffline: "ما زال الاتصال غير متاح. يرجى التحقق من اتصال الشبكة والمحاولة مجددًا.",
        langToggle: "English",
        pwaHint: "نظام صدى • مساحة العمل التشغيلية"
      }
    };

    let currentLang = 'en';
    let isVerifying = false;

    // Detect user preferences from existing SADA storage
    function initPreferences() {
      // 1. Theme sync: Default to clean white/subtle off-white canonical design;
      // only adopt dark mode if explicitly chosen in SADA settings
      try {
        const storedTheme = localStorage.getItem('sada-theme');
        if (storedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}

      // 2. Language sync (from localStorage 'sada-lang' or URL param 'lang')
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        const storedLang = localStorage.getItem('sada-lang');
        const browserLang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';

        currentLang = (urlLang === 'ar' || urlLang === 'en') ? urlLang : (storedLang === 'ar' || storedLang === 'en') ? storedLang : browserLang;
      } catch (_) {
        currentLang = 'en';
      }

      applyLanguage(currentLang);
    }

    function applyLanguage(lang) {
      currentLang = lang;
      const t = I18N[lang] || I18N.en;

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = t.title;

      document.getElementById('heading').textContent = t.heading;
      document.getElementById('desc-line1').textContent = t.descLine1;
      document.getElementById('desc-line2').textContent = t.descLine2;
      document.getElementById('lang-btn').textContent = t.langToggle;
      document.getElementById('pwa-hint').textContent = t.pwaHint;

      if (!isVerifying) {
        document.getElementById('retry-text').textContent = t.btnRetry;
        updateStatusPill('offline', t.statusOffline);
      }
    }

    function toggleLanguage() {
      const nextLang = currentLang === 'ar' ? 'en' : 'ar';
      try {
        localStorage.setItem('sada-lang', nextLang);
      } catch (_) {}
      applyLanguage(nextLang);
    }

    function updateStatusPill(state, text) {
      const pill = document.getElementById('status-pill');
      const statusText = document.getElementById('status-text');

      pill.classList.remove('is-offline', 'is-checking', 'is-restored');
      if (state === 'offline') pill.classList.add('is-offline');
      if (state === 'checking') pill.classList.add('is-checking');
      if (state === 'restored') pill.classList.add('is-restored');

      statusText.textContent = text;
    }

    function showFeedback(message) {
      const banner = document.getElementById('feedback-banner');
      if (message) {
        banner.textContent = message;
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
        banner.textContent = '';
      }
    }

    // ============================================================
    // RELIABLE RECONNECTION VERIFICATION
    // ============================================================
    async function attemptReconnection() {
      if (isVerifying) return;
      isVerifying = true;

      const t = I18N[currentLang] || I18N.en;
      showFeedback(null);

      const btn = document.getElementById('retry-btn');
      const spinner = document.getElementById('retry-spinner');
      const btnText = document.getElementById('retry-text');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = t.btnConnecting;
      updateStatusPill('checking', t.statusChecking);

      // 1. Fast browser check
      if (!navigator.onLine) {
        await new Promise((r) => setTimeout(r, 600));
        finishFailedAttempt(t.feedbackOffline);
        return;
      }

      // 2. Real network verification ping to server / backend
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        // Ping cache-busted favicon or API endpoint to test actual upstream connectivity
        const pingUrl = `/favicon.svg?_ping=${Date.now()}`;
        const response = await fetch(pingUrl, {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (response.ok || (response.status >= 200 && response.status < 400)) {
          // Success! Show restored indicator briefly before returning
          updateStatusPill('restored', t.statusRestored);
          btnText.textContent = t.statusRestored;
          spinner.style.display = 'none';

          await new Promise((r) => setTimeout(r, 500));

          // Determine return destination
          const returnTo = new URLSearchParams(window.location.search).get('returnTo');
          if (returnTo && returnTo.startsWith('/')) {
            window.location.replace(returnTo);
          } else {
            window.location.reload();
          }
          return;
        } else {
          throw new Error('Server returned ' + response.status);
        }
      } catch (err) {
        finishFailedAttempt(t.feedbackOffline);
      }
    }

    function finishFailedAttempt(errorMessage) {
      isVerifying = false;
      const t = I18N[currentLang] || I18N.en;

      const btn = document.getElementById('retry-btn');
      const spinner = document.getElementById('retry-spinner');
      const btnText = document.getElementById('retry-text');

      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = t.btnRetry;

      updateStatusPill('offline', t.statusOffline);
      showFeedback(errorMessage);
    }

    // Auto-listen to network state changes
    window.addEventListener('online', () => {
      // Browser reports network back; perform quiet background check to verify
      attemptReconnection();
    });

    window.addEventListener('offline', () => {
      const t = I18N[currentLang] || I18N.en;
      updateStatusPill('offline', t.statusOffline);
    });

    // Run setup
    initPreferences();
  </script>
